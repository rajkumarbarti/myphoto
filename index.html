    <!-- आपका विज्ञापन कोड यहाँ सुरक्षित रूप से जोड़ा गया है -->
    <script src="https://pl31008431.profitableratecpmnetwork.com/18/a7/73/18a773cc1ffc556738ba4fb2eac52902.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0000; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        .app-card { width: 100%; max-width: 950px; background: #1a0000; border: 2px solid #ffcc00; border-radius: 15px; padding: 15px; box-shadow: 0 0 30px rgba(255, 153, 0, 0.4); text-align: center; }
        h2 { color: #ffcc00; font-size: 24px; text-shadow: 0 0 10px #ff0000; margin-bottom: 5px; }
        p.sub { font-size: 13px; color: #ffeb3b; margin-bottom: 12px; }
        
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(255,204,0,0.3); }
        .input-group label { display: block; font-size: 11px; color: #ffeb3b; font-weight: bold; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #ffcc00; background: #fff; color: #000; font-size: 12px; }
        
        .canvas-container { width: 100%; display: flex; justify-content: center; margin-bottom: 12px; position: relative; }
        canvas { width: 100%; max-width: 900px; height: auto; border: 3px solid #ffcc00; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.9); background: #200; }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        button.action-btn { background: linear-gradient(45deg, #ff9900, #ff3300); color: white; border: none; padding: 12px 18px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,153,0,0.4); }
        button.whatsapp-btn { background: linear-gradient(45deg, #25D366, #128C7E); color: white; border: none; padding: 12px 18px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>✨ 3D AI फेस्टिवल पोस्टर ✨</h2>
    <p class="sub">बाउंसिंग टेक्स्ट और परफेक्ट एनिमेशन के साथ</p>

    <div class="controls-grid">

                <optgroup label="--- नवरात्रि 10 दिन ---">
                    <option value="nav_1">1. माँ शैलपुत्री</option>

                    <option value="nav_3">3. माँ चंद्रघंटा</option>
                    <option value="nav_4">4. माँ कुष्मांडा</option>
                    <option value="nav_5">5. माँ स्कंदमाता</option>
                    <option value="nav_6">6. माँ कात्यायनी</option>
                    <option value="nav_7">7. माँ कालरात्रि</option>
                    <option value="nav_8">8. महाअष्टमी</option>
                    <option value="nav_9">9. महानवमी</option>
                    <option value="nav_10">10. विजयादशमी</option>
                </optgroup>
                <optgroup label="--- अन्य त्यौहार ---">
                    <option value="fest_dhanteras">धनतेरस</option>
                    <option value="fest_nahay_khay">नहाय खाय</option>
                    <option value="fest_diwali">मुख्य दिवाली</option>
                    <option value="fest_govardhan">गोवर्धन पूजा</option>
                    <option value="fest_kharna">खरना</option>
                    <option value="fest_chath">छठ पूजा</option>

        <div class="input-group">

            <label style="color:#00ffcc;">3. मैन्युअल बैकग्राउंड फोटो चुनें:</label>
            <input type="file" id="bgFileInput" accept="image/*" multiple>

        <div class="input-group">
            <label>4. अपनी फोटो:</label>
            <input type="file" id="userFileInput" accept="image/*" multiple>

    <div class="canvas-container">
        <canvas id="posterCanvas" width="1200" height="675"></canvas>
    </div>

    <div class="btn-group">
        <button class="action-btn" id="recordVideoBtn">📥 वीडियो डाउनलोड</button>
        <button class="whatsapp-btn" id="whatsappShareBtn">💬 WhatsApp शेयर</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    let manualBgImages = []; 
    let processedUserImages = []; 
    let wishX = canvas.width;
    let wishColorHue = 0;
    let globalTime = 0;

    let bX = 200, bY = 150;
    let bSpeedX = 4.0, bSpeedY = 3.0;
    let bColor = "#ff0055";

    function getBouncingText(key) {
        if (key.startsWith('nav_')) return "🌟 जय माता दी 🌟";
        if (key.includes('chath') || key.includes('kharna') || key.includes('nahay')) return "☀️ शुभ छठ पूजा ☀️";
        if (key.includes('diwali') || key.includes('dhanteras') || key.includes('govardhan')) return "🪔 शुभ दीपावली 🪔";
        if (key.includes('janmashtami')) return "🈁 जय श्री कृष्ण 🈁";
        if (key.includes('day')) return "🚩 जय श्री राम 🚩";
        return "✨ शुभ पर्व ✨";
    }

    const sideQuotes4Lines = { 
        'day_1': ['रविवार का दिन', 'ऊर्जा और', 'उत्साह से', 'भरे 🌟'], 
        'day_2': ['सोमवार लाए', 'जीवन में', 'नई', 'शुरुआत ✨'], 
        'day_3': ['मंगलवार का दिन', 'बढ़ाए', 'आपका', 'साहस 💪'], 
        'day_4': ['बुधवार बने', 'बुद्धि और', 'ज्ञान का', 'प्रतीक 🌸'], 
        'day_5': ['गुरुवार दे', 'आपको', 'सफलता का', 'प्रकाश ☀️'], 
        'day_6': ['शुक्रवार लाए', 'घर में', 'सुख और', 'समृद्धि 🌺'], 
        'day_7': ['शनिवार को', 'करें कर्म', 'प्रधान', 'शुभ दिन ⚡'],
        'nav_1': ['माँ शैलपुत्री', 'की कृपा', 'सदा आप पर', 'बनी रहे 🙏'], 
        'nav_2': ['माँ ब्रह्मचारिणी', 'दें आपको', 'अटल', 'ज्ञान 🌼'], 
        'nav_3': ['माँ चंद्रघंटा', 'हर लें', 'आपके', 'सारे संकट 🛡️'], 
        'nav_4': ['माँ कुष्मांडा', 'प्रदान करें', 'उत्तम', 'आरोग्य 🌿'],
        'nav_5': ['माँ स्कंदमाता', 'का आशीर्वाद', 'जीवन को', 'महकाए 🌸'], 
        'nav_6': ['माँ कात्यायनी', 'करें सबका', 'कल्याण और', 'उद्धार ✨'], 
        'nav_7': ['माँ कालरात्रि', 'करें हमेशा', 'आपकी', 'सुरक्षा ⚡'], 
        'nav_8': ['महाअष्टमी पर', 'माँ की', 'भक्ति में', 'लीन हो जाओ 🌺'],
        'nav_9': ['महानवमी पर', 'बरसे माँ की', 'विशेष', 'असीम कृपा 🌟'], 
        'nav_10': ['विजयदशमी पर', 'सत्य की', 'सदा होती है', 'जीत 🏹'],
        'fest_dhanteras': ['धनतेरस पर', 'आपके घर', 'बरसे अपार', 'धन 🪙'], 
        'fest_nahay_khay': ['नहाय खाय के', 'साथ हो', 'पवित्र', 'मन 🍃'], 
        'fest_diwali': ['दीपावली का', 'दीपक रोशन', 'करे आपका', 'जीवन 🪔'],
        'fest_govardhan': ['गोवर्धन पूजा', 'से मिले', 'सुख और', 'समृद्धि ⛰️'], 
        'fest_kharna': ['खरना व्रत से', 'आए जीवन में', 'पवित्रता', 'सुख 🌾'], 
        'fest_chath': ['छठ मइया का', 'आशीर्वाद', 'सबको मिले', 'अद्भुत ☀️'],
        'fest_janmashtami': ['श्री कृष्ण', 'जन्माष्टमी की', 'मच जाए', 'धूम 🈁']
    };

    const festivalWishesText = {
        'day_1': 'आपका रविवार मंगलमय और सुखद हो!', 'day_2': 'हर हर महादेव! आपका सोमवार शुभ हो!',
        'day_3': 'जय हनुमान! मंगलवार की हार्दिक शुभकामनाएं!', 'day_4': 'भगवान गणेश की कृपा बनी रहे! शुभ बुधवार!',
        'day_5': 'भगवान विष्णु की कृपा से आपका गुरुवार शुभ हो!', 'day_6': 'माँ लक्ष्मी की कृपा सदा बनी रहे! शुभ शुक्रवार!',
        'day_7': 'शनिदेव की कृपा आप पर बनी रहे! शुभ शनिवार!',
        'nav_1': 'माँ शैलपुत्री आपकी हर मनोकामना पूरी करें!', 'nav_2': 'माँ ब्रह्मचारिणी आपके जीवन में सुख-शांति लाएं!',
        'nav_3': 'माँ चंद्रघंटा की कृपा आप पर सदा बनी रहे!', 'nav_4': 'माँ कुष्मांडा आप सभी को आरोग्य प्रदान करें!',
        'nav_5': 'माँ स्कंदमाता की असीम कृपा आप पर बनी रहे!', 'nav_6': 'माँ कात्यायनी आपके जीवन में समृद्धि लाएं!',
        'nav_7': 'माँ कालरात्रि आपकी सभी संकटों से रक्षा करें!', 'nav_8': 'महाअष्टमी की हार्दिक शुभकामनाएं!',
        'nav_9': 'महानवमी की हार्दिक शुभकामनाएं!', 'nav_10': 'विजयादशमी (दशहरा) की हार्दिक शुभकामनाएं!',
        'fest_dhanteras': 'धनतेरस की हार्दिक शुभकामनाएं!', 'fest_nahay_khay': 'छठ पूजा नहाय-खाय की हार्दिक शुभकामनाएं!',
        'fest_diwali': 'दीपावली एवं महालक्ष्मी पूजा की हार्दिक शुभकामनाएं!',
        'fest_govardhan': 'गोवर्धन पूजा की हार्दिक शुभकामनाएं!', 'fest_kharna': 'छठ पूजा (खरना) की हार्दिक शुभकामनाएं!',
        'fest_chath': 'छठ पूजा के पावन पर्व की अनंत शुभकामनाएं!', 'fest_janmashtami': 'श्री कृष्ण जन्माष्टमी की हार्दिक शुभकामनाएं!'
    };

    const particles = [];
    for (let i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 5 + 2,
            speedY: Math.random() * 1.2 + 0.4,
            speedX: Math.random() * 0.8 - 0.4,
            alpha: Math.random()
        });
    }

    document.getElementById('bgFileInput').addEventListener('change', function(e) {
        let files = Array.from(e.target.files);
        if (files.length > 0) {
            manualBgImages = []; 
            files.forEach(file => {
                let reader = new FileReader();
                reader.onload = (event) => {
                    let img = new Image();
                    img.onload = () => { manualBgImages.push(img); };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
    });

    document.getElementById('userFileInput').addEventListener('change', function(e) {
        const files = Array.from(e.target.files).slice(0, 2);
        processedUserImages = [];
        files.forEach(file => {
            let reader = new FileReader();
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() { cleanPhotoBackground(img, (cleaned) => processedUserImages.push(cleaned)); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    });

    function cleanPhotoBackground(img, callback) {
        let tempCanvas = document.createElement('canvas');
        let tCtx = tempCanvas.getContext('2d');
        tempCanvas.width = img.width; tempCanvas.height = img.height;
        tCtx.drawImage(img, 0, 0);
        let imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        let data = imgData.data, bgR = data[0], bgG = data[1], bgB = data[2];
        for (let i = 0; i < data.length; i += 4) {
            if (Math.abs(data[i] - bgR) + Math.abs(data[i+1] - bgG) + Math.abs(data[i+2] - bgB) < 55) data[i+3] = 0;
        }
        tCtx.putImageData(imgData, 0, 0);
        let resImg = new Image();
        resImg.onload = () => callback(resImg);
        resImg.src = tempCanvas.toDataURL();
    }

    function drawBackground(vibeScale) {
        let time = Date.now() * 0.002;
        
        let grad = ctx.createRadialGradient(
            canvas.width / 2 + Math.sin(time) * 150, 
            canvas.height / 2 + Math.cos(time) * 100, 
            40, canvas.width / 2, canvas.height / 2, 800
        );
        grad.addColorStop(0, '#ff5500');
        grad.addColorStop(0.5, '#600000');
        grad.addColorStop(1, '#180000');
        
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (manualBgImages.length > 0) {
            let totalTime = (Date.now() / 1000) % (manualBgImages.length * 5);
            let photoIndex = Math.floor(totalTime / 5);
            let currentImg = manualBgImages[photoIndex % manualBgImages.length];

            if (currentImg && currentImg.complete && currentImg.naturalWidth !== 0) {
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                let baseScale = 1.0 + Math.sin((totalTime % 5) * Math.PI / 5) * 0.03;
                let finalScale = baseScale * vibeScale;
                ctx.scale(finalScale, finalScale);
                try { 
                    ctx.drawImage(currentImg, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height); 
                } catch(e){}
                ctx.restore();
            }
        }
    }

    function getRandomColor() {
        const letters = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        globalTime += 0.03;

        let vibeScale = 1.0 + (Math.sin(Date.now() * 0.004) * 0.03);
        drawBackground(vibeScale);

        particles.forEach(p => {
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 220, 0, ${p.alpha})`;
            ctx.arc(p.x, p.y, p.size * vibeScale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            p.y -= p.speedY; p.x += p.speedX;
            if (p.y < 0) p.y = canvas.height;
            if (p.x > canvas.width) p.x = 0;
            if (p.x < 0) p.x = canvas.width;
        });

        let selFest = document.getElementById('festivalSelect').value;
        let bounceText = getBouncingText(selFest);

        ctx.save();
        ctx.font = "bold 38px 'Segoe UI', Arial";
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 25;
        ctx.fillStyle = bColor;

        bX += bSpeedX;
        bY += bSpeedY;

        let textWidth = ctx.measureText(bounceText).width;
        let textHeight = 35;

        if (bX <= 20 || bX + textWidth >= canvas.width - 20) {
            bSpeedX *= -1;
            bColor = getRandomColor();
        }
        if (bY - textHeight <= 30 || bY >= canvas.height - 90) {
            bSpeedY *= -1;
            bColor = getRandomColor();
        }

        ctx.fillText(bounceText, bX, bY);
        ctx.restore();

        let pWidth = 220, pHeight = 270, pY = canvas.height - pHeight - 45;
        let name = document.getElementById('userNameInput').value;
        let photoX = 15;

        processedUserImages.forEach((img, index) => {
            let currentX = index === 0 ? photoX : (canvas.width - pWidth - 15);
            ctx.drawImage(img, currentX, pY, pWidth, pHeight);
            ctx.save();
            ctx.fillStyle = "#ffff00";
            ctx.shadowColor = "#ff0000"; 
            ctx.shadowBlur = 15;
            ctx.font = "bold 36px Arial";
            ctx.textAlign = "center";
            ctx.fillText(name, currentX + (pWidth / 2), pY + pHeight + 35);
            ctx.restore();
        });

        let lines = sideQuotes4Lines[selFest] || ['शुभकामनाएं', '', '', ''];

        ctx.save();
        ctx.font = "bold 38px 'Segoe UI', Arial";
        ctx.textAlign = "left";
        ctx.shadowColor = "#ff5500";
        ctx.shadowBlur = 20;

        let startX = 25;
        let startY = 85;
        let lineSpacing = 52;

        lines.forEach((textLine, idx) => {
            let lineCycle = Math.sin(globalTime + (idx * 0.8));
            let alpha = Math.max(0.4, (lineCycle + 1) / 2); 
            let yOffset = lineCycle * 14;

            ctx.fillStyle = `rgba(255, 255, 120, ${alpha})`;
            ctx.fillText(textLine, startX, startY + (idx * lineSpacing) + yOffset);
        });

        ctx.restore();

        let wishSentence = festivalWishesText[selFest] || "हार्दिक शुभकामनाएं!";
        let fullScrollingText = (name ? ("✨ " + name + " की ओर से — ") : "") + wishSentence + " 🙏";
        
        ctx.save();
        ctx.font = "bold 40px 'Segoe UI', Arial";
        let clipLeftLimit = processedUserImages.length > 0 ? (photoX + pWidth + 15) : 260;
        ctx.beginPath();
        ctx.rect(clipLeftLimit, canvas.height - 70, canvas.width - clipLeftLimit, 70);
        ctx.clip();

        wishX -= 3.5;
        ctx.fillStyle = `hsl(${wishColorHue}, 100%, 75%)`;
        ctx.shadowColor = "#ffffff"; 
        ctx.shadowBlur = 15;
        ctx.textBaseline = "alphabetic";
        ctx.fillText(fullScrollingText, wishX, canvas.height - 20);
        
        let textWidthScroll = ctx.measureText(fullScrollingText).width;
        if (wishX < -(textWidthScroll + 50)) { 
            wishX = canvas.width; 
            wishColorHue = (wishColorHue + 60) % 360; 
        }
        ctx.restore();

        requestAnimationFrame(animate);
    }

    // वीडियो डाउनलोड बटन
    document.getElementById('recordVideoBtn').addEventListener('click', function() {
        let btn = this;
        if (btn.disabled) return;
        btn.disabled = true;

        let totalTimeMs = 10000, intervalTime = 100, elapsed = 0;
        let progressInterval = setInterval(() => {
            elapsed += intervalTime;
            let percent = Math.min(Math.floor((elapsed / totalTimeMs) * 100), 99);
            btn.innerText = `⏳ वीडियो बन रही है... (${percent}%)`;
        }, intervalTime);

        const stream = canvas.captureStream(30);
        let mediaRecorder;
        try {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        } catch (e) {
            mediaRecorder = new MediaRecorder(stream);
        }

        const recordedChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            clearInterval(progressInterval);
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            btn.innerText = `📥 डाउनलोड हो रहा है...`;
            setTimeout(() => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `3D_Poster_Video.webm`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                btn.innerText = "📥 वीडियो डाउनलोड";
                btn.disabled = false;
            }, 500);
        };

        mediaRecorder.start(1000);
        setTimeout(() => { if (mediaRecorder.state !== "inactive") mediaRecorder.stop(); }, 10000);
    });

    // WhatsApp शेयर बटन
    document.getElementById('whatsappShareBtn').addEventListener('click', function() {
        let name = document.getElementById('userNameInput').value || "मेरे मित्र";
        let text = `✨ 3D AI फेस्टिवल पोस्टर! ✨\n\n${name} की तरफ से आपको शुभकामनाएं।`;
        let url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    });

    requestAnimationFrame(animate);
</script>
