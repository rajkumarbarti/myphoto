function makePath(relativePath){
  // हर folder/file segment को URL-safe बनाता है; spaces वाले names भी काम करेंगे।
  return relativePath.split('/').map(encodeURIComponent).join('/');
}

function loadImage(url){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('Image not found: '+url));
    img.src=makePath(url);
  });
}

async function loadAutoBackgrounds(key){
  autoBgImages=[];
  const files=AUTO_FILES[key]||[];
  if(!files.length){setStatus('ऑटो फोटो उपलब्ध नहीं');return}

  for(const file of files){
    try{
      const img=await loadImage(file);
      autoBgImages.push(img);
    }catch(err){
      console.warn(err.message);
    }
  }

  if(autoBgImages.length){
    setStatus('ऑटो बैकग्राउंड लोड हो गया ✓');
  }else{
    setStatus('ऑटो फोटो नहीं मिली — GitHub में नाम/पाथ जाँचें');
  }
}

function getTodayIST(){
  const parts=new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'
  }).formatToParts(new Date());
  const v={};
  parts.forEach(p=>{if(p.type!=='literal')v[p.type]=p.value;});
  return `${v.year}-${v.month}-${v.day}`;
}

function getTodayWeekdayKey(){
  const weekday=new Intl.DateTimeFormat('en-US',{
    timeZone:'Asia/Kolkata',weekday:'short'
  }).format(new Date());
  const map={Sun:'day_1',Mon:'day_2',Tue:'day_3',Wed:'day_4',Thu:'day_5',Fri:'day_6',Sat:'day_7'};
  return map[weekday]||'day_1';
}

function findFestivalKey(festivals){
  const list=Array.isArray(festivals)?festivals:[];
  for(const fest of list){
    const raw=[
      fest?.name,
      fest?.local_names?.hindi,
      ...(Array.isArray(fest?.also_known_as)?fest.also_known_as:[])
    ].filter(Boolean).join(' ').toLowerCase();

    for(const [word,key] of Object.entries(FESTIVAL_KEYWORDS)){
      if(raw.includes(word))return key;
    }
  }
  return null;
}

async function setAutomaticCalendarSelection(){
  const fallback=getTodayWeekdayKey();
  let selectedKey=null;

  try{
    const today=getTodayIST();
    const response=await fetch(`${FESTIVAL_API_URL}?date=${encodeURIComponent(today)}&religion=hindu`,{
      cache:'no-store'
    });
    if(!response.ok)throw new Error('Festival API unavailable');
    const json=await response.json();
    const festivals=Array.isArray(json)?json:(json.data||json.festivals||[]);
    selectedKey=findFestivalKey(festivals);
  }catch(err){
    console.warn('Online Hindi calendar unavailable; weekday fallback active.',err);
  }

  const key=(selectedKey&&AUTO_FILES[selectedKey])?selectedKey:fallback;
  if(festivalSelect){
    const option=[...festivalSelect.options].find(o=>o.value===key);
    if(option)festivalSelect.value=key;
  }
  await loadAutoBackgrounds(key);
  return key;
}

// Run automatic calendar once at startup and again after local midnight.
// Festival has priority over weekday; weekday is the safe offline fallback.
function scheduleNextCalendarRefresh(){
  const now=new Date();
  const nowIST=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
  const next=new Date(nowIST);
  next.setHours(24,1,0,0);
  const delay=Math.max(60000,next-nowIST);
  setTimeout(async()=>{
    await setAutomaticCalendarSelection();
    scheduleNextCalendarRefresh();
  },delay);
}

function cleanPhotoBackground(img,callback){
  const tempCanvas=document.createElement('canvas');
  const tCtx=tempCanvas.getContext('2d');
  tempCanvas.width=img.width;tempCanvas.height=img.height;
  tCtx.drawImage(img,0,0);
  let imgData;
  try{imgData=tCtx.getImageData(0,0,tempCanvas.width,tempCanvas.height)}
  catch(e){callback(img);return}
  const data=imgData.data,bgR=data[0],bgG=data[1],bgB=data[2];
  for(let i=0;i<data.length;i+=4){
    if(Math.abs(data[i]-bgR)+Math.abs(data[i+1]-bgG)+Math.abs(data[i+2]-bgB)<55)data[i+3]=0;
  }
  tCtx.putImageData(imgData,0,0);
  const resImg=new Image();
  resImg.onload=()=>callback(resImg);
  resImg.src=tempCanvas.toDataURL('image/png');
}

function drawCover(img,x,y,w,h){
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(!iw||!ih)return;

  // फोटो के ratio के अनुसार automatic adaptive fit.
  // पहले screen भरने वाला soft background, फिर पूरा original photo।
  const bgScale=Math.max(w/iw,h/ih);
  const bgW=iw*bgScale,bgH=ih*bgScale;
  const bgX=x+(w-bgW)/2,bgY=y+(h-bgH)/2;

  ctx.save();
  ctx.filter='blur(28px)';
  ctx.globalAlpha=.92;
  ctx.drawImage(img,bgX,bgY,bgW,bgH);
  ctx.restore();

  // मुख्य फोटो बिना crop और बिना stretch के।
  const fitScale=Math.min(w/iw,h/ih);
  const photoRatio=iw/ih;
  const screenRatio=w/h;

  // बहुत छोटी फोटो को हल्का adaptive zoom मिलता है,
  // लेकिन zoom इतना सीमित है कि फोटो crop नहीं होती।
  const adaptiveBoost=photoRatio<screenRatio?1.06:1.03;
  const scale=fitScale*adaptiveBoost;

  let dw=iw*scale,dh=ih*scale;
  if(dw>w||dh>h){
    const safeScale=Math.min(w/iw,h/ih);
    dw=iw*safeScale;
    dh=ih*safeScale;
  }

  const dx=x+(w-dw)/2,dy=y+(h-dh)/2;
  ctx.save();
  ctx.drawImage(img,0,0,iw,ih,dx,dy,dw,dh);
  ctx.restore();
}

function drawBackground(vibeScale){
  const w=canvas.width,h=canvas.height;
  const time=globalTime;
  const grad=ctx.createRadialGradient(w/2+Math.sin(time*.7)*150,h/2+Math.cos(time*.6)*100,40,w/2,h/2,800);
  grad.addColorStop(0,'#ff5500');grad.addColorStop(.5,'#600000');grad.addColorStop(1,'#180000');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);

  const images=manualBgImages.length?manualBgImages:autoBgImages;
  if(!images.length)return;

  // हर 10 सेकंड में अगली फोटो; केवल smooth transition.
  const slot=10;
  const transitionDur=2;
  const cycle=Math.floor(time/slot);
  const phase=time%slot;
  const showingIndex=cycle%images.length;
  const inTransition=(cycle>0 && phase<transitionDur);
  const currentIndex=inTransition?((cycle-1+images.length)%images.length):showingIndex;
  const nextIndex=showingIndex;
  const currentImg=images[currentIndex];
  const nextImg=images[nextIndex];

  const drawPhoto=(img,alpha=1)=>{
    if(!img||!img.complete)return;

    // बहुत हल्का cinematic zoom + pan + corner drift.
    // Movement धीमा रखा गया है ताकि फोटो natural और smooth लगे।
    const driftX=Math.sin(time*0.16)*w*0.012;
    const driftY=Math.cos(time*0.13)*h*0.009;
    const pulse=1+Math.sin(time*0.11)*0.012;

    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(w/2+driftX,h/2+driftY);
    ctx.scale(vibeScale*pulse,vibeScale*pulse);
    drawCover(img,-w/2,-h/2,w,h);
    ctx.restore();
  };

  if(currentImg)drawPhoto(currentImg,1);

  if(nextImg && inTransition){
    const q=phase/transitionDur;
    const smooth=q*q*(3-2*q);
    drawPhoto(nextImg,smooth);
  }
}

function getRandomColor(){
  const letters='0123456789ABCDEF';let color='#';
  for(let i=0;i<6;i++)color+=letters[Math.floor(Math.random()*16)];
  return color;
}


async function detectFacesAndSetSafeArea(){
  if(faceDetectBusy)return;
  faceDetectBusy=true;
  try{
    if('FaceDetector' in window){
      const detector=new FaceDetector({fastMode:true,maxDetectedFaces:10});
      const faces=await detector.detect(canvas);
      detectedFaces=faces.map(f=>f.boundingBox).filter(b=>b.width>8&&b.height>8);
    }else{
      // Unsupported browsers use a conservative upper-left safe zone.
      detectedFaces=[];
    }
  }catch(e){
    detectedFaces=[];
  }finally{
    faceDetectBusy=false;
  }
}

function chooseSafeQuoteBox(boxW,boxH){
  const margin=14;
  const candidates=[
    {x:18,y:14,w:boxW,h:boxH},                         // top-left
    {x:canvas.width-boxW-18,y:14,w:boxW,h:boxH},       // top-right
    {x:18,y:canvas.height-boxH-18,w:boxW,h:boxH},     // bottom-left
    {x:canvas.width-boxW-18,y:canvas.height-boxH-18,w:boxW,h:boxH} // bottom-right
  ];

  const overlap=(a,b)=>{
    return !(a.x+a.w+margin<b.x || b.x+b.width+margin<a.x ||
             a.y+a.h+margin<b.y || b.y+b.height+margin<a.y);
  };

  // Prefer a corner with no detected face. If every corner overlaps,
  // select the corner with the smallest face overlap.
  let best=candidates[0],bestScore=Infinity;
  for(const c of candidates){
    let score=0;
    for(const f of detectedFaces){
      if(overlap(c,f))score+=1+(Math.min(c.x+c.w,f.x+f.width)-Math.max(c.x,f.x))*
        (Math.min(c.y+c.h,f.y+f.height)-Math.max(c.y,f.y));
    }
    if(score<bestScore){bestScore=score;best=c;}
  }
  faceSafeQuoteBox=best;
  return best;
}


function getBeatPulse(){
  return 0.5+0.5*Math.sin(globalTime*8.8);
}
function drawAdvancedFestivalEffects(){
  const w=canvas.width,h=canvas.height,t=globalTime,beat=getBeatPulse();
  ctx.save();
  const sweep=((t%7)/7)*(w*1.6)-w*.35;
  const g=ctx.createLinearGradient(sweep-160,0,sweep+160,0);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(.5,'rgba(255,255,255,.13)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.globalAlpha=.025+.035*beat;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  for(let i=0;i<28;i++){
    const x=(i*137+t*(8+i%4)*3)%w;
    const y=(i*71-t*(5+i%3)*2)%h;
    ctx.globalAlpha=.16+.12*Math.sin(t*2+i);
    ctx.beginPath();ctx.arc(x,(y+h)%h,1.3+(i%3)*.7,0,Math.PI*2);
    ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.fill();
  }
  const vg=ctx.createRadialGradient(w*.5,h*.45,Math.min(w,h)*.18,w*.5,h*.45,Math.max(w,h)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(.72,'rgba(0,0,0,.04)');
  vg.addColorStop(1,'rgba(0,0,0,.28)');
  ctx.globalAlpha=1;ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
  ctx.restore();
}

function getPhotoTransitionState(){
  const local=globalTime%30, start=10, dur=1.8;
  return {local,transition:(local>=start&&local<start+dur)?(local-start)/dur:0};
}
function animate(){
  if(Math.floor(globalTime)%3===0 && !faceDetectBusy)detectFacesAndSetSafeArea();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  globalTime+=.03;
  const vibeScale=1+Math.sin(Date.now()*.004)*.03;
  drawBackground(vibeScale);

  particles.forEach(p=>{
    ctx.beginPath();ctx.fillStyle=`rgba(255,220,0,${p.alpha})`;
    ctx.arc(p.x,p.y,p.size*vibeScale,0,Math.PI*2);ctx.fill();
    p.y-=p.speedY;p.x+=p.speedX;
    if(p.y<0)p.y=canvas.height;
    if(p.x>canvas.width)p.x=0;
    if(p.x<0)p.x=canvas.width;
  });

  const selFest=festivalSelect.value;
  const bounceText=getBouncingText(selFest);
  ctx.save();
  ctx.font="bold 38px 'Segoe UI',Arial";
  ctx.shadowColor='#fff';ctx.shadowBlur=25;ctx.fillStyle=bColor;
  bX+=bSpeedX;bY+=bSpeedY;
  const textWidth=ctx.measureText(bounceText).width,textHeight=35;
  if(bX<=20||bX+textWidth>=canvas.width-20){bSpeedX*=-1;bColor=getRandomColor()}
  if(bY-textHeight<=30||bY>=canvas.height-90){bSpeedY*=-1;bColor=getRandomColor()}
  ctx.fillText(bounceText,bX,bY);ctx.restore();

  const pWidth=220,pHeight=270,pY=canvas.height-pHeight-45;
  const name=document.getElementById('userNameInput').value;
  const photoX=15;
  processedUserImages.forEach((img,index)=>{
    const currentX=index===0?photoX:canvas.width-pWidth-15;
    ctx.drawImage(img,currentX,pY,pWidth,pHeight);
    ctx.save();ctx.fillStyle='#ffff00';ctx.shadowColor='#ff0000';ctx.shadowBlur=15;
    ctx.font='bold 36px Arial';ctx.textAlign='center';
    ctx.fillText(name,currentX+pWidth/2,pY+pHeight+35);ctx.restore();
  });

  drawAdvancedFestivalEffects();
  // सीमित कोने में बड़ा, साफ, 3D सुविचार — सभी lines बराबर width
  const isCustom=selFest==='custom_suvichar';
  const customRaw=(document.getElementById('customSuvicharInput')?.value||'').trim();
  const shastra=isCustom
    ? {sanskrit:customRaw||'अपना सुविचार यहाँ लिखें।',hindi:''}
    : (SHASTRIYA_TEXTS[selFest]||DEFAULT_SHASTRIYA_TEXT);

  const splitLines=t=>String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const sLines=splitLines(shastra.sanskrit);
  const hLines=splitLines(shastra.hindi);

  // संस्कृत ऊपर, हिंदी नीचे।
  const source=[
    ...sLines.map(text=>({text,type:'sanskrit'})),
    ...hLines.map(text=>({text,type:'hindi'}))
  ];

  const boxW=Math.min(455,canvas.width*.42);
  const boxH=Math.min(330,canvas.height*.49);
  const safeBox=chooseSafeQuoteBox(boxW,boxH);
  const boxX=safeBox.x,boxY=safeBox.y;
  const pad=12;
  const innerW=boxW-pad*2;

  const build=5.8,hold=4.0,erase=5.0;
  const t=globalTime%(build+hold+erase);

  const graphemes=text=>{
    if(window.Intl&&Intl.Segmenter)
      return Array.from(new Intl.Segmenter('hi',{granularity:'grapheme'}).segment(text),x=>x.segment);
    return Array.from(text);
  };

  // पहले font size चुनें ताकि longest line भी bounded box में fit हो।
  const longest=(arr)=>arr.reduce((m,x)=>Math.max(m,ctx.measureText(x).width),0);
  const fitFont=(arr,max,min,weight)=>{
    for(let f=max;f>=min;f--){
      ctx.font=`${weight} ${f}px 'Noto Sans Devanagari','Mangal','Segoe UI',Arial,sans-serif`;
      if(longest(arr)<=innerW)return f;
    }
    return min;
  };

  let sf=fitFont(sLines,42,27,'900');
  let hf=fitFont(hLines,32,21,'700');

  // Height-safe sizing: 2/3/4+ lines can fit inside the selected corner
  // without growing over the person's face.
  const lineCount=Math.max(1,source.length);
  const maxUsableH=boxH-pad*2-8;
  const idealMaxH=Math.max(44,Math.floor(maxUsableH/Math.max(lineCount,1)));
  sf=Math.min(sf,Math.max(27,idealMaxH-7));
  hf=Math.min(hf,Math.max(21,idealMaxH-9));

  // हर मूल line को उसके font के अनुसार wrap करें।
  const wrapped=[];
  source.forEach(item=>{
    const font=item.type==='hindi'?hf:sf;
    ctx.font=`${item.type==='hindi'?'700':'900'} ${font}px 'Noto Sans Devanagari','Mangal','Segoe UI',Arial,sans-serif`;
    let cur='';
    for(const g of graphemes(item.text)){
      const next=cur+g;
      if(cur&&ctx.measureText(next).width>innerW){
        wrapped.push({text:cur,type:item.type});
        cur=g;
      }else cur=next;
    }
    if(cur)wrapped.push({text:cur,type:item.type});
  });

  // सबसे लंबी line को reference मानकर बाकी lines को उसी visual width तक
  // letter-spacing बढ़ाकर बराबर किया जाता है। इससे हर line एक सी दिखती है।
  const widths=wrapped.map(item=>{
    const f=item.type==='hindi'?hf:sf;
    ctx.font=`${item.type==='hindi'?'700':'900'} ${f}px 'Noto Sans Devanagari','Mangal','Segoe UI',Arial,sans-serif`;
    return ctx.measureText(item.text).width;
  });
  const targetWidth=Math.min(innerW,Math.max(...widths,0));

  const total=wrapped.reduce((n,x)=>n+graphemes(x.text).length,0);
  let show=total;
  if(t<build)show=Math.min(total,Math.floor(t/build*total)+1);
  else if(t>=build+hold)show=Math.max(0,total-Math.floor((t-build-hold)/erase*total)-1);

  ctx.save();
  ctx.beginPath();
  ctx.rect(boxX,boxY,boxW,boxH);
  ctx.clip();

  let remaining=show;
  let y=boxY+pad+20;

  wrapped.forEach((item,i)=>{
    if(remaining<=0)return;

    const arr=graphemes(item.text);
    const n=Math.min(arr.length,remaining);
    const text=arr.slice(0,n).join('');
    if(!text)return;

    const font=item.type==='hindi'?hf:sf;
    const weight=item.type==='hindi'?'700':'900';

    ctx.font=`${weight} ${font}px 'Noto Sans Devanagari','Mangal','Segoe UI',Arial,sans-serif`;
    ctx.textAlign='left';
    ctx.textBaseline='middle';

    // पूरा visible line बराबर चौड़ाई का:
    // अक्षरों के बीच अतिरिक्त spacing केवल तभी लगती है जब पूरी line उपलब्ध हो।
    const natural=ctx.measureText(text).width;
    let letterSpacing=0;
    const fullLine=(n===arr.length);
    if(fullLine && arr.length>1 && targetWidth>natural){
      letterSpacing=Math.min(5.5,(targetWidth-natural)/(arr.length-1));
    }

    const hue=item.type==='hindi'
      ? (195+i*24+globalTime*15)%360
      : (35+i*31+globalTime*18)%360;
    const fill=`hsl(${hue},100%,72%)`;
    const edge=`hsl(${(hue+45)%360},100%,58%)`;

    // अक्षर-दर-अक्षर animation में हर grapheme साफ दिखे; 00/duplicate नहीं।
    let x=boxX+pad;
    const glyphs=graphemes(text);

    glyphs.forEach(g=>{
      ctx.shadowColor='rgba(0,0,0,.82)';
      ctx.shadowBlur=9;
      ctx.shadowOffsetX=3;
      ctx.shadowOffsetY=5;
      ctx.fillStyle=fill;
      ctx.fillText(g,x,y);

      ctx.shadowColor=edge;
      ctx.shadowBlur=7;
      ctx.shadowOffsetX=0;
      ctx.shadowOffsetY=0;
      ctx.fillStyle=fill;
      ctx.fillText(g,x,y);

      x+=ctx.measureText(g).width+letterSpacing;
    });

    y+=font+9;
    remaining-=n;
  });

  ctx.restore();

  const wishSentence=festivalWishesText[selFest]||'हार्दिक शुभकामनाएं!';
  const fullScrollingText=(name?'✨ '+name+' की ओर से — ':'')+wishSentence+' 🙏';
  ctx.save();
  ctx.font="bold 40px 'Segoe UI',Arial";
  const clipLeftLimit=processedUserImages.length?(photoX+pWidth+15):260;
  ctx.beginPath();ctx.rect(clipLeftLimit,canvas.height-70,canvas.width-clipLeftLimit,70);ctx.clip();
  wishX-=3.5;
  ctx.fillStyle=`hsl(${wishColorHue},100%,75%)`;
  ctx.shadowColor='#fff';ctx.shadowBlur=15;
  ctx.fillText(fullScrollingText,wishX,canvas.height-20);
  const textWidthScroll=ctx.measureText(fullScrollingText).width;
  if(wishX<-(textWidthScroll+50)){wishX=canvas.width;wishColorHue=(wishColorHue+60)%360}
  ctx.restore();

  requestAnimationFrame(animate);
}

  try{recorder=mimeType?new MediaRecorder(stream,{mimeType}):new MediaRecorder(stream)}
  catch(e){
    setStatus('वीडियो रिकॉर्डर शुरू नहीं हुआ। Chrome में फिर कोशिश करें।');
    stream.getTracks().forEach(t=>t.stop());
    btn.disabled=false;
    return;
  }

  const chunks=[];
  let elapsed=0;
  const timer=setInterval(()=>{
    elapsed+=100;
    btn.textContent=`⏳ वीडियो बन रही है... ${Math.min(100,Math.floor(elapsed/10000*100))}%`;
  },100);

  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onerror=()=>setStatus('वीडियो रिकॉर्डिंग में त्रुटि हुई।');
  recorder.onstop=()=>{
    clearInterval(timer);
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:mimeType||'video/webm'});
    if(!blob.size){
      setStatus('वीडियो खाली बनी। Chrome में दोबारा कोशिश करें।');
      btn.textContent='📥 वीडियो डाउनलोड';btn.disabled=false;return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='3D_Poster_Video.webm';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    btn.textContent='📥 वीडियो डाउनलोड';btn.disabled=false;
    setStatus('वीडियो डाउनलोड शुरू हो गया ✓');
  };

  recorder.start(500);
  setStatus('30 सेकंड की वीडियो बन रही है… डाउनलोड पूरा होने पर फ़ाइल सेव होगी।');
  setTimeout(()=>{if(recorder.state!=='inactive')recorder.stop()},30000);
});
